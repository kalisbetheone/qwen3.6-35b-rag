[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["frontend", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI: Depends(...) trong giá trị mặc định là cách dùng chuẩn
]

[tool.ruff.lint.per-file-ignores]
"eval/build_qa_set.py" = ["E501"]   # dữ liệu câu hỏi/đáp án dài
"scripts/make_notebooks.py" = ["E501"]   # mã của cell notebook

[tool.ruff.lint.isort]
known-first-party = ["api", "common", "eval", "generation", "ingest", "retrieval", "scripts"]
